<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">SpringRain 개발자 프로필 배너</title>
  <desc id="desc">SpringRain. 백엔드와 클라우드 인프라를 연결합니다. API 설계, 비동기 작업, 운영 자동화.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="1" stop-color="#0d2235"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25d0c4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4da7c7" stop-opacity=".15"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="460" fill="url(#bg)"/>
  <circle cx="1370" cy="70" r="150" fill="#25d0c4" opacity=".08" filter="url(#soft)"/>
  <circle cx="1130" cy="420" r="110" fill="#4da7c7" opacity=".06" filter="url(#soft)"/>
  <path d="M0 390 C320 330 540 440 820 382 S1240 300 1600 360" fill="none" stroke="#17384d" stroke-width="1"/>

  <g transform="translate(126 108)">
    <rect x="0" y="-3" width="7" height="178" rx="3.5" fill="#25d0c4"/>
    <text x="42" y="64" fill="#f2f8fb" font-family="Inter, Pretendard, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">SpringRain</text>
    <text x="45" y="126" fill="#b9d0d8" font-family="Pretendard, Arial, sans-serif" font-size="28" font-weight="400">백엔드와 클라우드 인프라를 연결합니다</text>
    <text x="45" y="188" fill="#25d0c4" font-family="Pretendard, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="1">API 설계 · 비동기 작업 · 운영 자동화</text>
  </g>

  <g transform="translate(1010 76)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 92 H210 M210 92 L276 48 M210 92 L276 136 M276 48 H388 M276 136 H388" stroke="#25d0c4" stroke-width="3" opacity=".8"/>
    <path d="M388 48 L456 92 L388 136" stroke="#6bcbd0" stroke-width="2" opacity=".55"/>
    <rect x="0" y="55" width="80" height="74" rx="9" stroke="#7cc9d0" stroke-width="2" opacity=".75"/>
    <path d="M20 76 H60 M20 94 H60 M20 112 H48" stroke="#25d0c4" stroke-width="3" opacity=".8"/>
    <rect x="388" y="20" width="104" height="56" rx="8" stroke="#538da8" stroke-width="2" opacity=".75"/>
    <rect x="388" y="108" width="104" height="56" rx="8" stroke="#538da8" stroke-width="2" opacity=".75"/>
    <circle cx="210" cy="92" r="11" fill="#25d0c4" stroke="#071525" stroke-width="6"/>
    <circle cx="276" cy="48" r="6" fill="#74d8d3" stroke="none"/>
    <circle cx="276" cy="136" r="6" fill="#74d8d3" stroke="none"/>
    <path d="M508 92 h54" stroke="url(#glow)" stroke-width="2" opacity=".6"/>
    <path d="M530 70 v44 M508 92 h44" stroke="#25d0c4" stroke-width="2" opacity=".55"/>
  </g>

  <path d="M126 407 H1474" stroke="#1d4255" stroke-width="1"/>
  <circle cx="126" cy="407" r="3" fill="#25d0c4"/>
</svg>
